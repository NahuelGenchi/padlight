name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Reads the code and runs it on made-up data; needs no other permission.
permissions:
  contents: read

jobs:
  checks:
    name: Source checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gjs and glib-compile-schemas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gjs libglib2.0-bin
      - name: Run the checks
        run: sh tests/run.sh
